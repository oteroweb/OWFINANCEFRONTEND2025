name: CI Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint + Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx vue-tsc --noEmit

  # OWF-295: dispara el auto-sync del puntero de submódulo en el repo central,
  # reemplazando el paso manual de correr sync-submodule-pointers.sh. Solo en
  # push a main (no en PRs) y solo si lint+typecheck pasaron. Requiere el secret
  # CENTRAL_DISPATCH_TOKEN (PAT con permiso "contents: write" sobre
  # oteroweb/OWFINANCE2026 — no confundir con SUBMODULES_DEPLOY_KEY, que es para
  # el otro sentido: central leyendo este repo).
  notify-central:
    name: Notify central (submodule sync)
    needs: lint-and-typecheck
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch frontend-updated to OWFINANCE2026
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.CENTRAL_DISPATCH_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/oteroweb/OWFINANCE2026/dispatches \
            -d "{\"event_type\":\"frontend-updated\",\"client_payload\":{\"sha\":\"${{ github.sha }}\"}}"
